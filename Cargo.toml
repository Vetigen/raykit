[workspace]
members = [
    "crates/raykit-core", "crates/raykit-vet", "crates/raykit-protocol",
    "crates/raykit-ffi", "crates/raykit-wasm", "crates/raykit-cli", "crates/raykit-node",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/Vetigen/raykit"

[workspace.dependencies]
raykit-core = { path = "crates/raykit-core", version = "=0.1.0", default-features = false }
raykit-vet = { path = "crates/raykit-vet", version = "=0.1.0" }
raykit-protocol = { path = "crates/raykit-protocol", version = "=0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = "debuginfo"
