[package]
name = "raykit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dicom-core = "=0.10.0"
dicom-dictionary-std = "=0.10.0"
flate2 = "1"
jpeg-decoder = { version = "=0.3.2", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
jpegls = { package = "pure_jpegls", version = "=2.1.0", optional = true }
openjp2 = { package = "openjpeg2-pure-rs", version = "=0.1.1", optional = true }
oxiarc-jpeg = { version = "=0.4.2", default-features = false, optional = true }

[features]
default = ["advanced-codecs"]
advanced-codecs = ["dep:jpegls", "dep:openjp2", "dep:oxiarc-jpeg"]

[dev-dependencies]
jpeg-encoder = "=0.7.1"
openjph-core = "=0.1.0"

[[example]]
name = "generate-fixtures"
path = "../../fixtures/generate.rs"

[[example]]
name = "landmark-ratio"
path = "../../examples/measurements/landmark_ratio.rs"
