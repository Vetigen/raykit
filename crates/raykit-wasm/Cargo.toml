[package]
name = "raykit-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["advanced-codecs"]
advanced-codecs = ["raykit-core/advanced-codecs"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
raykit-core.workspace = true
raykit-protocol.workspace = true
wasm-bindgen = "=0.2.128"
