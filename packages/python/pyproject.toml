[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raykit-dicom"
version = "0.1.0"
description = "RayKit by Vetigen DICOM toolkit for NumPy"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "numpy>=2.3; sys_platform == 'win32' and platform_machine == 'ARM64'",
]

[project.urls]
Repository = "https://github.com/Vetigen/raykit"

[tool.setuptools.packages.find]
include = ["raykit_dicom"]

[tool.setuptools.package-data]
raykit_dicom = ["native/*", "notices/*", "notices/*/*"]
