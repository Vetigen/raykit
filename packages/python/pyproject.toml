[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raykit"
version = "0.1.0"
description = "RayKit by Vetigen DICOM toolkit for NumPy"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools.package-data]
raykit = ["native/*", "notices/*", "notices/*/*"]
