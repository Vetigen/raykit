<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RayKit · DICOM Viewer</title>
  <style>
    :root{color-scheme:dark;background:#090e15;color:#eef3fa;font:15px/1.5 system-ui,sans-serif}
    body{margin:0 auto;max-width:92rem;padding:1.5rem clamp(.75rem,3vw,2.5rem)}
    header{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
    h1{margin:0;font-size:1.1rem;letter-spacing:.04em}nav{display:flex;gap:.5rem;flex-wrap:wrap}
    button{font:inherit;color:inherit;background:#1a2d34;border:1px solid #4c8e82;padding:.35rem .65rem;border-radius:.3rem;cursor:pointer}
    raykit-viewer{border:1px solid #2b3b4c;border-radius:.55rem;overflow:hidden}
    .aux{margin-top:1rem;padding:1rem;border:1px solid #2b3b4c;border-radius:.55rem}
    .aux canvas{display:block;max-width:100%;background:#020307;margin-top:.5rem;image-rendering:pixelated}
    .aux [data-controls]{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
    #series-preview img{width:8rem;image-rendering:pixelated}
  </style>
</head>
<body>
  <header><h1>RayKit by Vetigen</h1><nav aria-label="Synthetic images">
    <button data-fixture="signed12.dcm">Open synthetic radiograph</button>
    <button data-fixture="detail-signed12.dcm">Open 2048px detail chart</button>
    <button data-fixture="cine-350.dcm">Open 350-frame ultrasound</button>
    <button id="open-indexed">Open indexed ultrasound</button>
    <button data-fixture="enhanced-ct-oblique.dcm">Open oblique CT</button>
    <button data-fixture="large-enhanced-ct.dcm">Open 300-slice CT</button>
    <button data-fixture="comparison-ct.dcm">Open CT with named windows</button>
    <button data-fixture="large-enhanced-mr.dcm">Open 300-slice MR</button>
    <button id="open-dicomweb">Open local DICOMweb series</button>
    <button id="open-mr-pair">Compare T1 and T2</button>
    <button id="open-proof">Open proof-verified ultrasound</button>
    <button id="open-tiles">Open tiled radiograph</button>
    <button id="custom-worker">Inspect with a custom Worker</button>
  </nav></header>
  <figure id="series-preview" hidden>
    <img alt="Downsampled synthetic CT slice">
    <figcaption>Preview · measurement unavailable until the original arrives.</figcaption>
  </figure>
  <raykit-viewer></raykit-viewer>
  <output id="sample-error" aria-live="polite"></output>
  <section id="volume" class="aux" hidden aria-label="Volume reformat">
    <div data-controls>
      <button id="build-volume">Build volume</button>
      <label>Acquisition <select id="volume-acquisition"></select></label>
      <label>Plane <select id="volume-plane"><option>Axial</option><option>Coronal</option><option>Sagittal</option><option>Oblique</option><option value="source">Source grid</option></select></label>
      <label>Slab <select id="volume-slab"><option value="single">Single</option><option value="average">Average</option><option value="maximum">MIP</option></select></label>
      <label>Thickness (mm) <input id="volume-thickness" type="number" min="0.1" max="500" step="0.1" value="5"></label>
      <label>Sampling <select id="volume-sampling"><option value="trilinear">Trilinear</option><option value="nearest">Nearest</option></select></label>
      <label>Offset (mm) <input id="volume-offset" type="range" min="-6" max="6" step="0.1" value="0"></label>
      <label>Center <input id="volume-center" type="number" step="any" value="200"></label>
      <label>Width <input id="volume-width" type="number" min="1" step="any" value="400"></label>
      <label>Palette <select id="volume-palette"><option value="gray">Gray</option><option value="hot">Hot</option></select></label>
      <button id="read-seg">Show synthetic SEG</button><button id="read-pr">Apply synthetic GSPS</button>
    </div>
    <output id="volume-status" aria-live="polite"></output>
    <canvas id="mpr" width="256" height="256"></canvas>
  </section>
  <section class="aux" aria-label="Synthetic streams">
    <div data-controls><button id="share-view">Synchronize two local viewers</button><button id="live">Start synthetic live stream</button>
      <button id="freeze-preview" disabled>Freeze</button><button id="disconnect-preview" disabled>Disconnect</button>
      <button id="bind-preview" disabled>Verify matching original</button><button id="live-series">Follow synthetic acquisitions</button></div>
    <div id="shared" hidden></div>
    <canvas id="live-canvas" width="1" height="1" hidden></canvas><output id="live-status" aria-live="polite"></output>
    <div id="live-original" style="position:relative;height:16rem" hidden></div>
    <section id="series-live-section" hidden aria-label="Original acquisitions">
      <div data-controls><button id="freeze-series">Freeze</button><button id="disconnect-series">Disconnect</button>
        <label>Acquisition <select id="series-member"><option value="">Follow latest</option></select></label></div>
      <output id="live-series-status" aria-live="polite"></output>
      <div id="series-surface" style="position:relative;height:16rem"></div>
    </section>
  </section>
  <section id="tiled-section" class="aux" hidden aria-label="Tiled radiograph">
    <canvas id="tiled-canvas" style="width:min(100%,56rem);height:30rem;touch-action:none"></canvas>
    <output id="tiled-status" aria-live="polite"></output>
  </section>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
