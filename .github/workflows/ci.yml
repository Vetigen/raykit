name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 4

jobs:
  versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      node: ${{ steps.versions.outputs.nodeBuild }}
      python: ${{ steps.versions.outputs.python }}
      flutter: ${{ steps.versions.outputs.flutterMinimum }}
      rust: ${{ steps.versions.outputs.rust }}
      bindgen: ${{ steps.versions.outputs.bindgen }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: versions
        run: python3 scripts/release.py check
      - run: python3 -m unittest discover -s tests -p test_release.py

  rust:
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web-build:
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RAYKIT_ARTIFACTS: artifacts/ci-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          node: ${{ needs.versions.outputs.node }}
          python: ${{ needs.versions.outputs.python }}
      - uses: ./.github/actions/web-toolchain
        with:
          bindgen: ${{ needs.versions.outputs.bindgen }}
          rust: ${{ needs.versions.outputs.rust }}
      - run: node scripts/package-local.mjs --web
      - run: npm run fixtures && npm run fixtures:delivery
      - name: Compare independent CT reference
        run: |
          python -m pip install 'pydicom==3.0.2' 'numpy==2.4.6'
          python tests/comparison_reference.py > "$RUNNER_TEMP/reference.json"
          python -c 'import json,sys; assert json.load(open(sys.argv[1])) == json.load(open("benchmarks/evidence/comparison-reference.json"))' "$RUNNER_TEMP/reference.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-web
          path: ${{ env.RAYKIT_ARTIFACTS }}/raykit-web*.tgz
          retention-days: 3
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-fixtures
          path: fixtures/generated/
          compression-level: 0
          retention-days: 3
          overwrite: true
          if-no-files-found: error

  web:
    needs: [versions, web-build]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RAYKIT_BROWSER: ${{ matrix.browser }}
      RAYKIT_ARTIFACTS: artifacts/ci-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          node: ${{ needs.versions.outputs.node }}
          python: ${{ needs.versions.outputs.python }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ci-web
          path: ${{ env.RAYKIT_ARTIFACTS }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ci-fixtures
          path: fixtures/generated
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright-core install --with-deps "$RAYKIT_BROWSER"
      - run: node tests/packaged-workflows.mjs --web

  flutter:
    needs: [versions, web-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain
        with:
          node: ${{ needs.versions.outputs.node }}
          python: ${{ needs.versions.outputs.python }}
          flutter: ${{ needs.versions.outputs.flutter }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ci-fixtures
          path: fixtures/generated
      - run: node scripts/prepare-examples.mjs --assets-only
      - name: Analyze and test Flutter SDK
        working-directory: packages/flutter
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=1
      - name: Analyze and test Flutter example
        working-directory: examples/flutter
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=1 test/example_test.dart

  ci-required:
    name: ci-required
    needs: [versions, rust, web-build, web, flutter]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = {job: value["result"] for job, value in json.loads(os.environ["RESULTS"]).items()}
          print(results)
          assert set(results) == {"versions", "rust", "web-build", "web", "flutter"}
          assert all(result == "success" for result in results.values())
          PY
