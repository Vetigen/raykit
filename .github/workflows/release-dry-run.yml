name: Release rehearsal
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA from main that contains the release workflows
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.select.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          COMMIT: ${{ inputs.commit }}
        run: python3 scripts/release_gate.py dry-run "$COMMIT"

  package:
    needs: select
    uses: ./.github/workflows/package.yml
    with:
      commit: ${{ needs.select.outputs.commit }}
